<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment Successful</title>

<style>
  * {
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    background: #f4f7fb;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 420px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    text-align: center;
    padding: 40px 30px;
  }

  .icon {
    width: 70px;
    height: 70px;
    background: #e9f7ef;
    color: #27ae60;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto 20px;
  }

  h1 {
    margin: 0;
    font-size: 24px;
    color: #2d7ff9;
  }

  p {
    margin: 12px 0;
    font-size: 14px;
    color: #555;
    line-height: 1.6;
  }

  .details {
    margin-top: 24px;
    font-size: 14px;
    color: #333;
  }

  .details div {
    margin-bottom: 8px;
  }

  .highlight {
    font-weight: 600;
  }

  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #999;
  }

  .btn {
    display: inline-block;
    margin-top: 22px;
    background: #2d7ff9;
    color: #fff;
    padding: 12px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn:hover {
    background: #1f65da;
  }
</style>
</head>

<body>

<div class="card">

  <div class="icon">✔</div>

  <h1>Payment Successful</h1>

  <p>
    Thank you for completing the payment.  
    Your transaction has been processed successfully.
  </p>

  <div class="details">
    <div>
      <span class="highlight">Amount Paid:</span> ₹ 554.50
    </div>
    <div>
      <span class="highlight">Service:</span> Domain name purchase & registration
    </div>
    <div>
      <span class="highlight">Customer:</span> UNNAM SWETHA
    </div>
  </div>

  <a href="#" class="btn">Go to Home</a>

  <div class="footer">
    🔒 Secure payment powered by PhonePe
  </div>

</div>

</body>
</html>

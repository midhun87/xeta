<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Payment Request - Xeta Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --accent: #eff6ff;
    --text-dark: #0f172a;
    --text-gray: #64748b;
    --success: #10b981;
    --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
    --card-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.1), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden; /* Prevent scrolling during load */
  }

  /* --- LOADER STYLES --- */
  #loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease-out, visibility 0.5s;
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  .loading-text {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dark);
    letter-spacing: 0.5px;
    animation: pulse 1.5s infinite ease-in-out;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* --- CARD STYLES --- */
  .main-container {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    width: 100%;
    max-width: 420px;
  }

  .main-container.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    position: relative;
  }

  /* Decorative top accent */
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
  }

  .card-header {
    padding: 40px 30px 20px;
    text-align: center;
    background: #ffffff;
    border-bottom: 1px solid #f1f5f9;
  }

  .logo-wrapper {
    height: 55px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-img {
    height: 100%;
    object-fit: contain;
  }

  .price-tag {
    margin-top: 10px;
  }

  .currency {
    font-size: 24px;
    color: var(--text-gray);
    font-weight: 500;
    vertical-align: top;
    line-height: 1.5;
  }

  .amount {
    font-size: 48px;
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: -1px;
    line-height: 1;
  }

  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 14px;
    background: #ecfdf5;
    color: #059669;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .card-body {
    padding: 30px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    font-size: 14px;
  }

  .detail-label {
    color: var(--text-gray);
    font-weight: 500;
    flex: 1;
  }

  .detail-value {
    color: var(--text-dark);
    font-weight: 600;
    text-align: right;
    flex: 1.5;
    word-break: break-word;
  }

  .detail-value.highlight {
    color: var(--primary);
  }

  .divider {
    height: 1px;
    background: #f1f5f9;
    margin: 24px 0;
  }

  .ref-box {
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    margin-top: 20px;
  }
  
  .ref-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-gray);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .ref-code {
    font-family: 'Monaco', 'Consolas', monospace;
    font-size: 13px;
    color: var(--text-dark);
    font-weight: 600;
  }

  /* Button Styling */
  .pay-btn {
    margin-top: 28px;
    background: #5f259f;
    color: white;
    width: 100%;
    padding: 18px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px -1px rgba(95, 37, 159, 0.1), 0 2px 4px -1px rgba(95, 37, 159, 0.06);
    position: relative;
    overflow: hidden;
  }

  /* Shine effect on button */
  .pay-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }

  .pay-btn:hover::after {
    left: 100%;
  }

  .pay-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(95, 37, 159, 0.3);
    background: #531f8a;
  }

  .pay-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  .footer-trust {
    text-align: center;
    margin-top: 24px;
    color: var(--text-gray);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    opacity: 0.8;
  }

  /* Fade out class for loader */
  .hidden {
    opacity: 0;
    visibility: hidden;
  }

</style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Securing Connection...</div>
  </div>

  <!-- Main Card Container -->
  <div class="main-container" id="main-content">
    <div class="card">
      
      <div class="card-header">
        <div class="logo-wrapper">
          <img src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png" alt="Xeta Solutions" class="logo-img">
        </div>
        
        <div class="price-tag">
          <span class="currency">₹</span>
          <span class="amount">554.50</span>
        </div>
        
        <div class="badge">Due Now</div>
      </div>

      <div class="card-body">
        
        <div class="detail-row">
          <span class="detail-label">Billed To</span>
          <span class="detail-value">LAKSHMI PRASANNA</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Email Address</span>
          <span class="detail-value highlight">binduswarupavemulapallii@gmail.com</span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Phone</span>
          <span class="detail-value">9652585995</span>
        </div>

        <div class="divider"></div>

        <div class="detail-row">
          <span class="detail-label">Service</span>
          <span class="detail-value">Domain name purchase and registration services</span>
        </div>

        <div class="ref-box">
          <div class="ref-label">Reference ID</div>
          <div class="ref-code">XetaPaymentslakshmiprasanna059</div>
        </div>

        <a href="https://phon.pe/6a31wjqw" target="_blank" class="pay-btn">
          <svg viewBox="0 0 24 24"><path d="M19.5 4.5H4.5c-.8 0-1.5.7-1.5 1.5v12c0 .8.7 1.5 1.5 1.5h15c.8 0 1.5-.7 1.5-1.5v-12c0-.8-.7-1.5-1.5-1.5zM13 16h-2v-2h2v2zm0-4h-2V8h2v4z" fill-rule="evenodd"/></svg>
          Pay Securely
        </a>

      </div>
    </div>

    <div class="footer-trust">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#10b981">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
      </svg>
      Encrypted & Secure Payment
    </div>
  </div>

  <script>
    // Simulate loading process
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader-overlay');
      const content = document.getElementById('main-content');
      const body = document.body;

      // Keep loader visible for at least 1.5 seconds to show effect
      setTimeout(() => {
        loader.classList.add('hidden');
        content.classList.add('visible');
        body.style.overflow = 'auto'; // Re-enable scrolling if needed
      }, 1500);
    });
  </script>

</body>
</html>

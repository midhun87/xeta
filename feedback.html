<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <link rel="icon" type="image/png" href="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png">
    <!-- SEO & Meta Tags -->
    <meta name="description" content="Share your valuable feedback for Xeta Tech Solutions platforms to help us improve your digital experience.">
    <meta name="keywords" content="Feedback, Xeta Tech Solutions, LBRCE, Lakshya, Proctorix, Testify, Digi Adhyapak">
    <meta name="author" content="Xeta Tech Solutions">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Feedback - Xeta Tech Solutions">
    <meta property="og:description" content="Share your valuable feedback for Xeta Tech Solutions platforms to help us improve your digital experience.">
    <meta property="og:type" content="website">
    
    <title>Feedback - Xeta Tech Solutions</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #f8fafc; /* slate-50 */
        }

        /* Video Intro Transitions */
        #intro-overlay {
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        .fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Main Content Transitions */
        #main-content {
            opacity: 0;
            transition: opacity 1s ease-in;
            display: none;
        }
        .content-visible {
            opacity: 1 !important;
            display: flex !important;
        }

        /* Multi-step Transitions */
        .step-container {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .hidden-step {
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }
        .active-step {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            position: relative;
            visibility: visible;
        }

        /* Star Rating Styles */
        .star-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-size: 1.75rem;
            color: #cbd5e1; /* slate-300 for a more professional empty look */
            transition: color 0.2s, transform 0.1s;
        }
        @media (hover: hover) {
            .star-btn:hover {
                transform: scale(1.1);
            }
        }
        .star-btn:active {
            transform: scale(0.9);
        }
        .star-btn.selected {
            color: #fbbf24; /* amber-400 */
        }

        /* Spinner */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Scrollbar for better mobile feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        
        /* Mobile Input enhancements */
        input, select, textarea {
            font-size: 16px !important; /* Prevents iOS zoom */
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- 1. Video Intro Overlay -->
    <div id="intro-overlay" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center">
        <video id="intro-video" class="absolute inset-0 w-full h-full object-cover" playsinline muted>
            <source src="https://res.cloudinary.com/djdwpjm7x/video/upload/v1770550594/Xeta_Tech_Solutions_nidand.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>
        <div class="absolute bottom-8 right-6 z-20 pointer-events-auto">
            <button onclick="endIntro()" class="flex items-center gap-2 bg-white/20 hover:bg-white/30 backdrop-blur-md border border-white/30 text-white px-5 py-2.5 rounded-full font-medium transition-all active:scale-95 shadow-lg">
                <span>Enter Portal</span> 
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- 2. Main Content -->
    <div id="main-content" class="min-h-screen flex-col relative w-full">
        
        <!-- Navigation -->
        <nav class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6">
                <div class="flex justify-between items-center h-16 sm:h-20">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <img src="https://res.cloudinary.com/dpz44zf0z/image/upload/v1760704788/XETA_SOLUTIONS_LOGO_bcsbwh.png" alt="Logo" class="h-10 sm:h-12 w-auto object-contain">
                        <span class="font-bold text-lg sm:text-xl tracking-tight text-slate-800 hidden sm:block">Xeta Tech Solutions</span>
                    </div>
                    <span class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-full bg-blue-50 text-blue-600 text-xs sm:text-sm font-semibold border border-blue-100">
                        Feedback Portal
                    </span>
                </div>
            </div>
        </nav>

        <!-- Main Form Section -->
        <main class="flex-grow flex items-start sm:items-center justify-center p-4 sm:p-8">
            <div class="w-full max-w-2xl">
                
                <div class="text-center mb-6 sm:mb-8 mt-4 sm:mt-0">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Your Feedback Matters</h1>
                    <p class="text-sm sm:text-base text-slate-500">Help us enhance your digital experience.</p>
                </div>

                <!-- Form Card -->
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                    <!-- Progress bar visually -->
                    <div class="flex h-1.5 bg-slate-100">
                        <div id="progress-bar" class="w-1/2 bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-300"></div>
                    </div>
                    
                    <div class="p-5 sm:p-8 relative">
                        
                        <!-- Success Message -->
                        <div id="success-message" class="hidden flex-col items-center justify-center py-8 text-center">
                            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-5 shadow-inner">
                                <i class="fas fa-check text-4xl text-green-500"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-800 mb-2">Thank You!</h3>
                            <p class="text-slate-500 mb-6">Your feedback has been successfully submitted to our team.</p>
                            <button onclick="resetForm()" class="text-blue-600 font-semibold underline px-4 py-2 rounded-lg hover:bg-blue-50">Submit Another Response</button>
                        </div>

                        <!-- Error Message -->
                        <div id="error-message" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r">
                            <div class="flex items-center">
                                <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                                <p class="text-sm text-red-700 font-medium">Something went wrong. Please try again.</p>
                            </div>
                        </div>

                        <!-- Form -->
                        <form id="feedback-form" action="https://formspree.io/f/meozwrwb" method="POST">
                            
                            <!-- STEP 1: Personal Info -->
                            <div id="step-1" class="step-container active-step">
                                <h2 class="text-lg font-bold text-slate-800 border-b pb-2 mb-5">1. Personal Details</h2>
                                <div class="space-y-4 sm:space-y-5">
                                    
                                    <!-- Name -->
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Full Name *</label>
                                        <input type="text" name="name" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all" placeholder="Enter your full name">
                                    </div>
                                    
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
                                        <!-- Mobile Number -->
                                        <div>
                                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mobile Number *</label>
                                            <input type="tel" name="mobile_number" required pattern="[0-9]{10}" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all" placeholder="10-digit number">
                                        </div>

                                        <!-- Email -->
                                        <div>
                                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email Address *</label>
                                            <input type="email" name="email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all" placeholder="your@email.com">
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-5">
                                        <!-- Roll Number -->
                                        <div>
                                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Roll Number (Optional)</label>
                                            <input type="text" name="roll_number" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all" placeholder="e.g. 20A81A05XX">
                                        </div>

                                        <!-- Organization -->
                                        <div>
                                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Organization / College *</label>
                                            <input type="text" name="organization" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all" placeholder="Enter organization name">
                                        </div>
                                    </div>

                                    <button type="button" onclick="goToStep(2)" class="mt-6 w-full py-3.5 sm:py-4 bg-slate-900 text-white rounded-xl font-bold text-base hover:bg-slate-800 transition-colors flex justify-center items-center gap-2 shadow-md">
                                        Proceed to Feedback <i class="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- STEP 2: Feedback Info -->
                            <div id="step-2" class="step-container hidden-step">
                                <h2 class="text-lg font-bold text-slate-800 border-b pb-2 mb-5">2. Website Feedback</h2>
                                <div class="space-y-5 sm:space-y-6">
                                    
                                    <!-- Website Select -->
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Which website are you reviewing? *</label>
                                        <div class="relative">
                                            <select name="website_reviewed" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all appearance-none text-slate-700 font-medium">
                                                <option value="" disabled selected>Select a platform...</option>
                                                <option value="Lakshya (lakshya.lbrce.ac.in)">Lakshya - lakshya.lbrce.ac.in</option>
                                                <option value="Events (events-lbrce.in)">Events - events-lbrce.in</option>
                                                <option value="Alumni (lbrce-alumni.in)">lbrce Alumni - lbrce-alumni.in</option>
                                                <option value="Digi Adhyapak (digiadhyapak.com)">Digi Adhyapak - digiadhyapak.com</option>
                                                <option value="Proctorix (proctorix.in)">Proctorix - proctorix.in</option>
                                                <option value="Testify (testify.xetasolutions.in)">Testify - testify.xetasolutions.in</option>
                                            </select>
                                            <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                                                <i class="fas fa-chevron-down text-slate-400 text-sm"></i>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Ratings Grid -->
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-4">
                                        <!-- UI Rating -->
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <label class="text-sm font-semibold text-slate-700">User Interface (UI)</label>
                                            <div class="rating-group flex items-center gap-1" data-target="ui-rating">
                                                <input type="hidden" name="Rating_UI" id="ui-rating" value="0">
                                                <button type="button" class="star-btn" data-value="1"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="2"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="3"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="4"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="5"><i class="far fa-star"></i></button>
                                            </div>
                                        </div>
                                        <hr class="border-slate-200">
                                        <!-- Performance Rating -->
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <label class="text-sm font-semibold text-slate-700">Performance & Speed</label>
                                            <div class="rating-group flex items-center gap-1" data-target="perf-rating">
                                                <input type="hidden" name="Rating_Performance" id="perf-rating" value="0">
                                                <button type="button" class="star-btn" data-value="1"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="2"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="3"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="4"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="5"><i class="far fa-star"></i></button>
                                            </div>
                                        </div>
                                        <hr class="border-slate-200">
                                        <!-- Features Rating -->
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                            <label class="text-sm font-semibold text-slate-700">Features & Functionality</label>
                                            <div class="rating-group flex items-center gap-1" data-target="feat-rating">
                                                <input type="hidden" name="Rating_Features" id="feat-rating" value="0">
                                                <button type="button" class="star-btn" data-value="1"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="2"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="3"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="4"><i class="far fa-star"></i></button>
                                                <button type="button" class="star-btn" data-value="5"><i class="far fa-star"></i></button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Written Feedback -->
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Detailed Suggestions / Comments *</label>
                                        <textarea name="detailed_feedback" rows="3" required class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 outline-none transition-all resize-y" placeholder="Tell us what you liked or what could be improved..."></textarea>
                                    </div>

                                    <!-- Navigation Buttons -->
                                    <div class="flex gap-3 pt-2">
                                        <button type="button" onclick="goToStep(1)" class="w-1/3 py-3.5 sm:py-4 bg-slate-100 text-slate-700 rounded-xl font-bold text-base hover:bg-slate-200 transition-colors shadow-sm">
                                            Back
                                        </button>
                                        <button type="submit" id="submit-btn" class="w-2/3 flex justify-center items-center py-3.5 sm:py-4 bg-blue-600 text-white rounded-xl font-bold text-base hover:bg-blue-700 transition-colors shadow-md gap-2">
                                            <span>Submit Feedback</span>
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- 1. Video Intro Logic ---
        const introOverlay = document.getElementById('intro-overlay');
        const mainContent = document.getElementById('main-content');
        const video = document.getElementById('intro-video');

        function endIntro() {
            introOverlay.classList.add('fade-out');
            mainContent.style.display = 'flex';
            setTimeout(() => {
                mainContent.classList.add('content-visible');
            }, 50);
            setTimeout(() => {
                introOverlay.style.display = 'none';
                video.pause();
            }, 800);
        }

        window.addEventListener('load', () => {
            video.muted = true;
            video.play().catch(e => console.log("Autoplay prevented"));
            video.addEventListener('ended', endIntro);
        });


        // --- 2. Multi-Step Form Logic ---
        function goToStep(stepNumber) {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const progressBar = document.getElementById('progress-bar');

            if (stepNumber === 2) {
                // Validate Step 1 before proceeding
                const step1Inputs = step1.querySelectorAll('input[required]');
                let isValid = true;
                for(let input of step1Inputs) {
                    if (!input.checkValidity()) {
                        input.reportValidity(); // Shows native browser tooltip
                        isValid = false;
                        break; // Stop at first invalid
                    }
                }
                
                if (!isValid) return;

                // Move to Step 2
                step1.classList.remove('active-step');
                step1.classList.add('hidden-step');
                
                setTimeout(() => {
                    step1.style.display = 'none';
                    step2.style.display = 'block';
                    // trigger reflow
                    void step2.offsetWidth;
                    step2.classList.remove('hidden-step');
                    step2.classList.add('active-step');
                    progressBar.style.width = '100%';
                }, 300); // Wait for fade out
                
            } else if (stepNumber === 1) {
                // Move back to Step 1
                step2.classList.remove('active-step');
                step2.classList.add('hidden-step');
                
                setTimeout(() => {
                    step2.style.display = 'none';
                    step1.style.display = 'block';
                    void step1.offsetWidth;
                    step1.classList.remove('hidden-step');
                    step1.classList.add('active-step');
                    progressBar.style.width = '50%';
                }, 300);
            }
        }

        // --- 3. Multi-Star Rating Logic ---
        document.querySelectorAll('.rating-group').forEach(group => {
            const input = group.querySelector('input[type="hidden"]');
            const btns = group.querySelectorAll('.star-btn');

            btns.forEach(btn => {
                // Hover effect
                btn.addEventListener('mouseenter', () => {
                    const val = parseInt(btn.dataset.value);
                    updateStars(btns, val);
                });

                // Click to set
                btn.addEventListener('click', () => {
                    const val = parseInt(btn.dataset.value);
                    input.value = val;
                    updateStars(btns, val);
                });
            });

            // Reset on mouse leave
            group.addEventListener('mouseleave', () => {
                updateStars(btns, parseInt(input.value));
            });
        });

        function updateStars(btnNodes, value) {
            btnNodes.forEach(btn => {
                const btnVal = parseInt(btn.dataset.value);
                const icon = btn.querySelector('i');
                if (btnVal <= value) {
                    btn.classList.add('selected');
                    icon.classList.remove('far');
                    icon.classList.add('fas');
                } else {
                    btn.classList.remove('selected');
                    icon.classList.remove('fas');
                    icon.classList.add('far');
                }
            });
        }


        // --- 4. Form Submission (AJAX) ---
        const form = document.getElementById("feedback-form");
        const submitBtn = document.getElementById("submit-btn");
        const successMsg = document.getElementById("success-message");
        const errorMsg = document.getElementById("error-message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const originalBtnContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div>';
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            errorMsg.classList.add('hidden');

            const data = new FormData(event.target);

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    // Success! Hide form, show Thank You message
                    form.style.display = 'none';
                    successMsg.classList.remove('hidden');
                    successMsg.classList.add('flex');
                } else {
                    throw new Error('Submission failed');
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnContent;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // --- 5. Reset Form Logic ---
        function resetForm() {
            form.reset();
            
            // Reset all star groups
            document.querySelectorAll('.rating-group').forEach(group => {
                const input = group.querySelector('input[type="hidden"]');
                input.value = 0;
                const btns = group.querySelectorAll('.star-btn');
                updateStars(btns, 0);
            });
            
            // Return to Step 1
            document.getElementById('progress-bar').style.width = '50%';
            
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step2.classList.remove('active-step');
            step2.classList.add('hidden-step');
            step2.style.display = 'none';
            
            step1.style.display = 'block';
            step1.classList.remove('hidden-step');
            step1.classList.add('active-step');
            
            // Show form again
            successMsg.classList.add('hidden');
            successMsg.classList.remove('flex');
            form.style.display = 'block';
            
            // Reset button
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Submit Feedback</span><i class="fas fa-paper-plane ml-2"></i>';
            submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
